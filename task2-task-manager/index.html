<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TaskFlow | Task Manager</title>
<meta name="description" content="A fast, offline task manager with categories, due dates, drag-and-drop and progress tracking.">
<meta name="theme-color" content="#2D5A3D">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<script>try{var t=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="spot" aria-hidden="true"></div>
<main class="app">
  <header class="top">
    <div><h1>My tasks</h1><p id="sum"></p></div>
    <button id="theme" aria-label="Toggle dark and light theme"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  </header>

  <section class="card prog" aria-label="Progress">
    <div class="ringw"><svg viewBox="0 0 100 100"><circle class="trk" cx="50" cy="50" r="45"/><circle id="ring" class="prg" cx="50" cy="50" r="45"/></svg><b id="pct">0%</b></div>
    <div class="stats"><div><b id="s-open">0</b><span>to do</span></div><div><b id="s-done">0</b><span>done</span></div><div><b id="s-od">0</b><span>overdue</span></div></div>
  </section>

  <form id="add" class="card" autocomplete="off">
    <input id="txt" placeholder="What needs doing?" maxlength="120" required aria-label="Task name">
    <select id="cat" aria-label="Category"><option>Work</option><option>Personal</option><option>Study</option></select>
    <select id="pri" aria-label="Priority"><option value="1">Low</option><option value="2" selected>Medium</option><option value="3">High</option></select>
    <input id="due" type="date" aria-label="Due date">
    <button class="btn" type="submit">Add task</button>
  </form>

  <div class="bar">
    <div class="seg" role="group" aria-label="Filter by status"><button data-f="all" class="on">All</button><button data-f="active">Active</button><button data-f="done">Completed</button></div>
    <select id="fcat" aria-label="Filter by category"><option value="all">All categories</option><option>Work</option><option>Personal</option><option>Study</option></select>
    <select id="sort" aria-label="Sort"><option value="manual">Manual order</option><option value="due">Due date</option><option value="pri">Priority</option></select>
    <input id="q" type="search" placeholder="Search (press /)" aria-label="Search tasks">
  </div>

  <ul id="list" aria-label="Tasks"></ul>
  <p id="empty" class="empty" hidden></p>

  <footer class="foot">
    <button id="exp">Export backup</button>
    <button id="impb">Import backup</button><input id="imp" type="file" accept="application/json" hidden>
    <button id="clr">Clear completed</button>
    <span class="hint">Press N to add a task. Drag tasks to reorder. Double-click to edit.</span>
  </footer>
</main>
<div id="toast" role="status" aria-live="polite" hidden><span></span><button type="button">Undo</button></div>
<script src="js/app.js" defer></script>
<script src="js/plus.js" defer></script>
</body>
</html>
