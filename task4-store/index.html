<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grove Market | Online Store</title>
<meta name="description" content="Shop electronics, jewelry and clothing with live search, filters and a persistent cart.">
<meta name="theme-color" content="#2D5A3D">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232D5A3D'/%3E%3Cpath d='M7 8h10l-1 8H8z' fill='%23F5F0E1'/%3E%3C/svg%3E">
<script>try{var t=localStorage.getItem('grove.theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="spot" aria-hidden="true"></div>
<a class="skip" href="#grid">Skip to products</a>
<header>
  <p class="ann">Free shipping over $100. Try code <b>WELCOME10</b> for 10% off.</p>
  <div class="wrap bar">
    <a class="brand" href="./">Grove<span>Market</span></a>
    <input id="q" type="search" placeholder="Search products (press /)" aria-label="Search products" autocomplete="off">
    <select id="sort" aria-label="Sort products"><option value="featured">Featured</option><option value="price-asc">Price: low to high</option><option value="price-desc">Price: high to low</option><option value="rating">Top rated</option></select>
    <button id="savedbtn" class="ib" aria-pressed="false" aria-label="Show saved items">&#9829;<i id="wc" hidden>0</i></button>
    <button id="ordbtn" class="ib" aria-label="Order history">Orders</button>
    <button id="theme" class="ib" aria-label="Toggle dark and light theme"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    <button id="cartbtn" class="ib" aria-label="Open cart"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11h10.2L20 7H6.2"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg><i id="badge" hidden>0</i></button>
  </div>
</header>

<main class="wrap">
  <div class="filters">
    <div id="cats" class="cats" role="group" aria-label="Categories"></div>
    <label class="rng">Max price <b id="maxl"></b><input id="max" type="range" min="1" max="1000" step="1" aria-label="Maximum price"></label>
  </div>
  <div id="note" class="note" hidden></div>
  <p id="count" class="count" aria-live="polite"></p>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" hidden><p>No products match your filters.</p><button id="reset" class="btn">Clear filters</button></div>
</main>
<footer class="wrap">Product data: FakeStoreAPI. This is a demo store: no real payments are taken.</footer>

<div id="scrim"></div>
<aside id="drawer" role="dialog" aria-modal="true" aria-label="Shopping cart" inert>
  <div class="dh"><h2>Your cart</h2><button id="dclose" class="ib" aria-label="Close cart">&#10005;</button></div>
  <div class="ship"><p id="shiptxt"></p><div class="bar2"><i id="shipbar"></i></div></div>
  <ul id="lines"></ul>
  <div class="df">
    <form id="promoform" class="promo"><input id="promo" placeholder="Promo code" aria-label="Promo code" autocomplete="off"><button class="btn sm" type="submit">Apply</button></form>
    <p id="promomsg" class="pm" aria-live="polite"></p>
    <dl id="sum"></dl>
    <button id="checkout" class="btn wide">Checkout</button>
    <button id="clearcart" class="lnk">Clear cart</button>
  </div>
</aside>

<dialog id="qv" aria-label="Product details"></dialog>
<dialog id="od" aria-label="Order history"></dialog>
<dialog id="co" aria-label="Checkout"></dialog>
<div id="toasts" aria-live="polite"></div>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
