<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skycast | Live Weather</title>
<meta name="description" content="Live weather for any city: current conditions, hourly trend and 5-day forecast.">
<meta name="theme-color" content="#2D5A3D">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232D5A3D'/%3E%3Ccircle cx='12' cy='12' r='4.5' fill='%23F5F0E1'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="app">
  <header class="top">
    <a class="brand" href="./">Skycast</a>
    <div class="search">
      <input id="q" type="search" placeholder="Search any city (press /)" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="sug" aria-autocomplete="list" aria-label="Search for a city">
      <ul id="sug" role="listbox" hidden></ul>
    </div>
    <button id="loc" class="ib" aria-label="Use my location" title="Use my location"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
    <button id="units" class="ib" aria-label="Switch between Celsius and Fahrenheit">°C</button>
  </header>
  <div id="chips" class="chips"></div>
  <div id="stale" class="stale" hidden></div>
  <div id="load" class="load" role="status"><span class="sp"></span>Loading weather...</div>
  <div id="err" class="err card" role="alert" hidden><p></p><button id="retry" class="btn">Try again</button></div>
  <main id="out" hidden>
    <section id="hero" class="card hero"></section>
    <section id="det" class="grid"></section>
    <section class="card"><h2>Next 24 hours</h2><div class="hrw"><div id="hi" class="hri"></div></div></section>
    <section><h2>5-day forecast</h2><div id="dy" class="dy"></div></section>
  </main>
  <footer id="foot"></footer>
</div>
<script src="js/config.js" defer></script>
<script src="js/api.js" defer></script>
<script src="js/app.js" defer></script>
</body>
</html>
